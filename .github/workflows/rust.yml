name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-llvm-15:
    runs-on: ubuntu-latest
    env:
      working-dir: ./bindings/rust
      NYXSTONE_LLVM_PREFIX: "/usr/lib/llvm-15/"
      NYXSTONE_LINK_FFI: "1"
    steps:
    - uses: actions/checkout@v4
    - name: Packages
      run: |
        sudo apt-get update
        sudo apt-get install llvm-15 llvm-15-dev zlib1g-dev libzstd-dev
    - name: Code quality
      run: |
        cargo fmt --all -- --check
        cargo clippy -- -D warnings
      working-directory: ${{ env.working-dir }}
    - name: Build
      run: cargo build
      working-directory: ${{ env.working-dir }}
    - name: Run tests
      run: cargo test
      working-directory: ${{ env.working-dir }}

  linux-llvm-21:
    runs-on: ubuntu-latest
    env:
      working-dir: ./bindings/rust
      NYXSTONE_LLVM_PREFIX: "/usr/lib/llvm-21/"
      NYXSTONE_LINK_FFI: "1"
    steps:
    - uses: actions/checkout@v4
    - name: Packages
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21
        sudo apt-get install -y llvm-21-dev zlib1g-dev libzstd-dev
    - name: Build
      run: cargo build
      working-directory: ${{ env.working-dir }}
    - name: Run tests
      run: cargo test
      working-directory: ${{ env.working-dir }}

  linux-llvm-22:
    runs-on: ubuntu-latest
    env:
      working-dir: ./bindings/rust
      NYXSTONE_LLVM_PREFIX: "/usr/lib/llvm-22/"
      NYXSTONE_LINK_FFI: "1"
    steps:
    - uses: actions/checkout@v4
    - name: Packages
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        sudo apt-get install -y llvm-22-dev zlib1g-dev libzstd-dev
    - name: Build
      run: cargo build
      working-directory: ${{ env.working-dir }}
    - name: Run tests
      run: cargo test
      working-directory: ${{ env.working-dir }}

  mac-llvm-15:
    runs-on: macos-latest
    env:
      working-dir: ./bindings/rust
    steps:
    - uses: actions/checkout@v4
    - name: Packages
      run: brew install llvm@15
    - name: Build
      run: NYXSTONE_LLVM_PREFIX="$(brew --prefix llvm@15)" NYXSTONE_LINK_FFI=1 cargo build
      working-directory: ${{ env.working-dir }}
    - name: Run tests
      run: NYXSTONE_LLVM_PREFIX="$(brew --prefix llvm@15)" NYXSTONE_LINK_FFI=1 cargo test
      working-directory: ${{ env.working-dir }}

  mac-llvm-16:
    runs-on: macos-latest
    env:
      working-dir: ./bindings/rust
    steps:
    - uses: actions/checkout@v4
    - name: Packages
      run: brew install llvm@16
    - name: Build
      run: NYXSTONE_LLVM_PREFIX="$(brew --prefix llvm@16)" NYXSTONE_LINK_FFI=1 cargo build
      working-directory: ${{ env.working-dir }}
    - name: Run tests
      run: NYXSTONE_LLVM_PREFIX="$(brew --prefix llvm@16)" NYXSTONE_LINK_FFI=1 cargo test
      working-directory: ${{ env.working-dir }}

  mac-llvm-17:
    runs-on: macos-latest
    env:
      working-dir: ./bindings/rust
    steps:
    - uses: actions/checkout@v4
    - name: Packages
      run: brew install llvm@17
    - name: Build
      run: NYXSTONE_LLVM_PREFIX="$(brew --prefix llvm@17)" NYXSTONE_LINK_FFI=1 cargo build
      working-directory: ${{ env.working-dir }}
    - name: Run tests
      run: NYXSTONE_LLVM_PREFIX="$(brew --prefix llvm@17)" NYXSTONE_LINK_FFI=1 cargo test
      working-directory: ${{ env.working-dir }}

  mac-llvm-18:
    runs-on: macos-latest
    env:
      working-dir: ./bindings/rust
    steps:
    - uses: actions/checkout@v4
    - name: Packages
      run: brew install llvm@18
    - name: Build
      run: NYXSTONE_LLVM_PREFIX="$(brew --prefix llvm@18)" NYXSTONE_LINK_FFI=1 cargo build
      working-directory: ${{ env.working-dir }}
    - name: Run tests
      run: NYXSTONE_LLVM_PREFIX="$(brew --prefix llvm@18)" NYXSTONE_LINK_FFI=1 cargo test
      working-directory: ${{ env.working-dir }}

